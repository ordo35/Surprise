<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ecem'e Özel ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #ffd1dc 0%, #fbc2eb 40%, #e8c5fc 70%, #ffdde1 100%);
      background-size: 300% 300%;
      animation: gradientShift 12s ease infinite alternate;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Arka plan ışık küreleri */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      opacity: 0.6;
      animation: floatOrb 8s infinite alternate ease-in-out;
    }

    .glow-orb-1 {
      width: 280px;
      height: 280px;
      background: rgba(255, 107, 149, 0.45);
      top: 15%;
      left: 10%;
    }

    .glow-orb-2 {
      width: 320px;
      height: 320px;
      background: rgba(206, 147, 255, 0.45);
      bottom: 15%;
      right: 10%;
      animation-delay: -4s;
    }

    @keyframes floatOrb {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(30px, -40px) scale(1.15);
      }
    }

    /* Parçacık Canvas ve Container */
    #floating-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .floating-item {
      position: absolute;
      bottom: -60px;
      font-size: 26px;
      line-height: 1;
      will-change: transform, opacity;
      animation: floatUpwards linear forwards;
      pointer-events: none;
      text-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
    }

    @keyframes floatUpwards {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(0.6);
        opacity: 0;
      }

      10% {
        opacity: 0.9;
        transform: translateY(-10vh) translateX(var(--drift-1)) rotate(var(--rot-1)) scale(1);
      }

      70% {
        opacity: 0.85;
      }

      100% {
        transform: translateY(-115vh) translateX(var(--drift-2)) rotate(var(--rot-2)) scale(1.1);
        opacity: 0;
      }
    }

    /* Merkez İçerik */
    .center-card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 25px;
      border-radius: 35px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 16px 40px rgba(240, 100, 160, 0.2),
        inset 0 0 20px rgba(255, 255, 255, 0.5);
      max-width: 90vw;
      transform: translateZ(0);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .center-card:active {
      transform: scale(0.97);
    }

    /* "ECEM" Harfleri */
    .title-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .letter {
      display: inline-block;
      font-size: clamp(3.4rem, 15vw, 6.2rem);
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1.1;
      opacity: 0;
      transform: scale(0) rotate(-20deg);
      animation: popInBounce 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      background: linear-gradient(135deg, #ff4071 0%, #ff6b9d 45%, #b34bfb 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 6px 14px rgba(255, 64, 113, 0.35));
      cursor: pointer;
      transition: transform 0.25s ease;
      will-change: transform, opacity;
    }

    /* Harf Zıplama Geliş Animasyonu */
    @keyframes popInBounce {
      0% {
        opacity: 0;
        transform: scale(0) translateY(50px) rotate(-25deg);
      }

      60% {
        opacity: 1;
        transform: scale(1.25) translateY(-15px) rotate(8deg);
      }

      80% {
        transform: scale(0.92) translateY(5px) rotate(-4deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0deg);
      }
    }

    /* Harflerin Sıralı Gelmesi */
    .letter:nth-child(1) {
      animation-delay: 0.25s;
    }

    .letter:nth-child(2) {
      animation-delay: 0.50s;
    }

    .letter:nth-child(3) {
      animation-delay: 0.75s;
    }

    .letter:nth-child(4) {
      animation-delay: 1.00s;
    }

    /* Harflerin Sonradan Tatlıca Dalgalanması */
    .waving {
      opacity: 1 !important;
      animation: subtleFloat 3.5s ease-in-out infinite alternate !important;
    }

    .letter:nth-child(1).waving {
      animation-delay: 0.1s !important;
    }

    .letter:nth-child(2).waving {
      animation-delay: 0.3s !important;
    }

    .letter:nth-child(3).waving {
      animation-delay: 0.5s !important;
    }

    .letter:nth-child(4).waving {
      animation-delay: 0.7s !important;
    }

    @keyframes subtleFloat {
      0% {
        transform: translateY(0px) rotate(0deg);
        opacity: 1;
      }

      50% {
        transform: translateY(-7px) rotate(2deg);
        opacity: 1;
      }

      100% {
        transform: translateY(3px) rotate(-2deg);
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      to {
        opacity: 0.9;
        transform: translateY(0);
      }
    }

    .tap-hint {
      margin-top: 22px;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(146, 52, 133, 0.7);
      background: rgba(255, 255, 255, 0.5);
      padding: 6px 16px;
      border-radius: 20px;
      opacity: 0;
      animation: fadeInUp 0.8s 1.6s ease forwards, pulseHint 2s 2.4s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulseHint {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.75;
      }

      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    /* Ekrana Tıklayınca Patlayan Efektler */
    .burst-item {
      position: absolute;
      pointer-events: none;
      z-index: 20;
      font-size: 24px;
      will-change: transform, opacity;
      animation: burstAnim 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes burstAnim {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.6) rotate(0deg);
      }

      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--tr));
      }
    }
  </style>
</head>

<body>

  <!-- Yumuşak Renk Küreleri -->
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <!-- Sürekli Yukarı Uçuşan Kalpler & İkizler Burçları -->
  <div id="floating-container"></div>

  <!-- Merkez Kartı -->
  <div class="center-card" id="mainCard">
    <div class="title-wrapper" id="titleLetters">
      <span class="letter">E</span>
      <span class="letter">C</span>
      <span class="letter">E</span>
      <span class="letter">M</span>
    </div>
    <div class="tap-hint">Ekrana dokun ✨</div>
  </div>

  <script>
    const floatingContainer = document.getElementById('floating-container');
    const letters = document.querySelectorAll('.letter');
    const mainCard = document.getElementById('mainCard');

    // Uçuşacak semboller: Pembe/Kırmızı Kalpler ve İkizler Burcu (♊)
    const symbols = ['♥️', '💖', '💕', '💗', '♊', '♊', '💓', '✨'];

    // İlk zıplama animasyonu bitince tatlı dalgalanma (waving) moduna geç
    setTimeout(() => {
      letters.forEach(letter => {
        letter.style.opacity = '1';
        letter.classList.add('waving');
      });
    }, 1800);

    // Rastgele aralıkta sayı üretici
    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Sürekli yukarı süzülen simgeler
    function createFloatingItem() {
      const item = document.createElement('div');
      item.className = 'floating-item';

      const symbol = symbols[Math.floor(Math.random() * symbols.length)];
      item.textContent = symbol;

      // İkizler burcu için tatlı morumsu/pembe stil
      if (symbol === '♊') {
        item.style.color = '#aa33ff';
        item.style.fontWeight = 'bold';
        item.style.filter = 'drop-shadow(0 2px 6px rgba(170, 51, 255, 0.4))';
      }

      const left = random(3, 93);
      const size = random(20, 36);
      const duration = random(6.5, 11);
      const drift1 = (Math.random() - 0.5) * 80 + 'px';
      const drift2 = (Math.random() - 0.5) * 140 + 'px';
      const rot1 = (Math.random() - 0.5) * 40 + 'deg';
      const rot2 = (Math.random() - 0.5) * 90 + 'deg';

      item.style.left = left + '%';
      item.style.fontSize = size + 'px';
      item.style.animationDuration = duration + 's';
      item.style.setProperty('--drift-1', drift1);
      item.style.setProperty('--drift-2', drift2);
      item.style.setProperty('--rot-1', rot1);
      item.style.setProperty('--rot-2', rot2);

      floatingContainer.appendChild(item);

      // Animasyon bittiğinde temizle
      setTimeout(() => {
        item.remove();
      }, duration * 1000);
    }

    // Düzenli aralıklarla yeni uçuşan nesneler ekle
    setInterval(createFloatingItem, 420);
    // Başlangıçta ekranın boş kalmaması için hemen birkaç tane üret
    for (let i = 0; i < 9; i++) {
      setTimeout(createFloatingItem, i * 200);
    }

    // Tıklanan/dokunulan yerden fırlayan kalpler ve İkizler burcu efekti
    function spawnBurst(x, y) {
      const count = 10;
      const burstSymbols = ['💖', '♥️', '♊', '💕', '✨'];

      for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'burst-item';
        span.textContent = burstSymbols[Math.floor(Math.random() * burstSymbols.length)];

        span.style.left = x + 'px';
        span.style.top = y + 'px';

        const angle = Math.random() * Math.PI * 2;
        const velocity = random(55, 135);
        const tx = Math.cos(angle) * velocity + 'px';
        const ty = (Math.sin(angle) * velocity - random(30, 70)) + 'px';
        const tr = (Math.random() - 0.5) * 180 + 'deg';
        const size = random(20, 34);

        span.style.fontSize = size + 'px';
        span.style.setProperty('--tx', tx);
        span.style.setProperty('--ty', ty);
        span.style.setProperty('--tr', tr);

        document.body.appendChild(span);

        setTimeout(() => span.remove(), 1100);
      }
    }

    // Ekranın herhangi bir yerine tıklama veya dokunma
    window.addEventListener('pointerdown', (e) => {
      // Eğer doğrudan harfe tıklanmadıysa fırlat
      spawnBurst(e.clientX, e.clientY);
    });

    // Harflere özel ekstra zıplama ve patlama efekti
    letters.forEach(letter => {
      letter.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        letter.style.transform = 'scale(1.4) translateY(-18px) rotate(10deg)';
        const rect = letter.getBoundingClientRect();
        spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);

        setTimeout(() => {
          letter.style.transform = '';
        }, 300);
      });
    });
  </script>
</body>

</html>
